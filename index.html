<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0c0e">
<title>Health Copilot — astronaut self-monitoring (prototype)</title>
<!--
  Health Copilot v2 — NASA Space Apps Challenge 2026 prototype.
  Single file, no build step, no dependencies. Open it in a browser; it works offline.
  All crew health data is SIMULATED. Decision-support prototype, not a medical device.
  Code written with assistance from an AI tool (Claude, Anthropic); see README.
-->
<style>
:root{--bg:#0b0c0e;--s1:#121316;--s2:#121316;--s3:#1e2025;--line:#2b2e35;--tx:#e8e9eb;--mut:#9a9fa8;--acc:#e8e9eb;--accink:#0b0c0e;
--l0:#4cc38a;--l1:#5b9fe0;--l2:#e0c04a;--l3:#ee8a3c;--l4:#e5484d;
--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
#rail{position:sticky;top:0;height:100vh;padding:20px 12px;border-right:1px solid var(--line);background:rgba(13,20,34,.85);display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:.01em;padding:0 6px}
.brand small{display:block;color:var(--mut);font-weight:500;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.navb{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border-radius:10px;padding:10px 12px;color:var(--mut);font-weight:550}
.navb:hover{background:var(--s2);color:var(--tx)}
.navb.on{background:var(--s3);color:var(--tx);box-shadow:inset 3px 0 0 var(--acc)}
.navb.on svg{color:var(--acc)}
.simnote{margin-top:auto;border:1px dashed rgba(242,210,92,.55);color:var(--l2);border-radius:10px;padding:10px;font-size:11.5px;line-height:1.4}
#top{position:sticky;top:0;z-index:8;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 26px;border-bottom:1px solid var(--line);background:rgba(7,11,20,.88);backdrop-filter:blur(10px)}
.mbrand{display:none}
.crewp{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:99px;padding:5px 12px 5px 8px;color:var(--mut);font-weight:550;font-size:13.5px}
.pill.on{background:var(--s3);color:var(--tx);border-color:var(--acc)}
.pill i{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;color:#08101c}
.tact{margin-left:auto;display:flex;gap:8px;align-items:center}
.dayctl{display:flex;align-items:center;gap:10px;flex:1 1 100%;min-width:0}
.dayctl input{flex:1;accent-color:var(--acc);min-width:80px}
.md b{font-size:19px;font-weight:700;display:block;line-height:1.1;white-space:nowrap}
.md span{color:var(--mut);font-size:11px;white-space:nowrap}
.btn{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ic{padding:5px 9px;line-height:1}
#view{padding:22px 26px 60px;max-width:1160px;width:100%}
.simstrip{display:inline-flex;gap:8px;align-items:center;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--l2);border:1px dashed rgba(242,210,92,.5);border-radius:99px;padding:3px 12px;margin-bottom:14px}
h1{font-size:34px;line-height:1.1;margin:0 0 6px;letter-spacing:-.02em;font-weight:800}
h2{font-size:13px;margin:0 0 12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:650}
.sub{color:var(--mut);margin:0 0 18px;max-width:70ch}
.card{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:16px;padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.mt{margin-top:14px}
.hero{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:center;border:1px solid color-mix(in srgb,var(--lc) 45%,var(--line));border-radius:20px;padding:24px;overflow:hidden;
background:radial-gradient(600px 240px at 0% 0%,color-mix(in srgb,var(--lc) 16%,transparent),transparent 70%),linear-gradient(180deg,var(--s2),var(--s1))}
.hglyph{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;color:#08101c;background:var(--lc);box-shadow:0 0 0 8px color-mix(in srgb,var(--lc) 18%,transparent)}
.hglyph.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 16px color-mix(in srgb,var(--lc) 6%,transparent)}}
.eyebrow{font-size:12px;letter-spacing:.16em;font-weight:750;color:var(--lc)}
.eyebrow em{font-style:normal;color:var(--l0);margin-left:8px}
.hero h1{font-size:32px;margin:4px 0 8px}
.hwhy{margin:0;color:#d5dceb;max-width:62ch}
.next{margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(7,11,20,.55);border:1px solid var(--line);max-width:66ch}
.next span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:700;margin-bottom:2px}
.hact{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.trail{align-self:end;text-align:right}
.trail .bars{display:flex;gap:3px;align-items:flex-end;height:34px;justify-content:flex-end}
.trail .bars i{width:7px;border-radius:2px;display:block}
.trail span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.sys{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:16px;padding:14px}
.sys:hover{border-color:var(--sc)}
.sys b{display:block;font-size:14.5px}
.sys .st{display:block;font-size:12px;color:var(--sc);font-weight:650}
.sys .lead{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.kv{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-end}
.kv div span{display:block;color:var(--mut);font-size:12px}
.kv div b{font-size:24px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.kv div b small{font-size:12px;color:var(--mut);font-weight:500;margin-left:3px}
.tag{display:inline-block;border:1px solid currentColor;border-radius:99px;font-size:10.5px;padding:1px 9px;letter-spacing:.08em;font-weight:650;vertical-align:middle}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:13px;color:var(--mut);font-weight:550;white-space:nowrap}
.chip.on{border-color:var(--acc);color:var(--acc);background:rgba(179,164,255,.08)}
.heatwrap{position:relative}
#heat{display:block;width:100%;touch-action:pan-y;cursor:crosshair}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px;align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.why{list-style:none;margin:0;padding:0}
.why li{padding:10px 0;border-bottom:1px solid var(--line)}
.why li:last-child{border:0}
.why .bar{height:5px;border-radius:9px;background:var(--s3);margin-top:7px;overflow:hidden}
.why .bar i{display:block;height:100%;border-radius:9px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:0 0 14px 44px;min-height:38px}
ol.steps li:before{content:counter(s);position:absolute;left:0;top:-2px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:750;background:var(--s3);border:1px solid var(--line);color:var(--acc);font-family:var(--mono)}
ul.clean{margin:0;padding-left:18px}ul.clean li{margin:7px 0}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
tr.hit td{background:rgba(179,164,255,.10)}
tr.hit td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
pre.rep{background:#04070d;border:1px solid var(--line);border-radius:12px;padding:14px;white-space:pre-wrap;font-size:12.5px;line-height:1.6;margin:0;color:#cfd8e8;overflow-wrap:anywhere}
.prog{height:8px;background:var(--s3);border-radius:9px;overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;background:var(--acc);width:0;border-radius:9px}
.note{color:var(--mut);font-size:12.5px}
.ccard{border-left:5px solid var(--lc)}
.ccard h3{margin:6px 0 0;font-size:18px}
svg text{fill:var(--mut);font-size:10.5px;font-family:var(--mono)}
svg text.big{fill:var(--tx);font-size:13px;font-family:var(--sans);font-weight:700}
.draw{stroke-dasharray:1;stroke-dashoffset:0}
#view.enter>*{animation:rise .4s ease both}
#view.enter>*:nth-child(3){animation-delay:.05s}#view.enter>*:nth-child(4){animation-delay:.1s}#view.enter>*:nth-child(5){animation-delay:.15s}#view.enter>*:nth-child(n+6){animation-delay:.2s}
#view.enter .draw{animation:draw 1s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes draw{from{stroke-dashoffset:1}}
.sig{stroke-dasharray:4 6;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
#tabs{display:none}
#tip{position:fixed;z-index:30;display:none;max-width:260px;background:#04070d;border:1px solid var(--acc);border-radius:12px;padding:10px 12px;font-size:12.5px;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#tip b{display:block;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(3,6,12,.86);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal .card{width:min(560px,100%)}
.modal h3{font-size:22px;margin:0 0 6px}
.pvt{height:230px;border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;justify-content:center;background:#04070d;font-size:56px;font-weight:700;user-select:none;cursor:pointer;margin:14px 0}
.sl{display:grid;grid-template-columns:90px 1fr 28px;gap:12px;align-items:center;margin:10px 0}
.sl input{accent-color:var(--acc)}
#tour{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(780px,calc(100vw - 24px));z-index:25;display:none;background:rgba(10,14,28,.97);border:1px solid var(--acc);border-radius:16px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.6)}
#tour .tprog{height:3px;background:var(--s3)}#tour .tprog i{display:block;height:100%;background:var(--acc);transition:width .4s}
#tour .tin{padding:12px 16px}
#tour .tstep{font-size:11px;letter-spacing:.14em;color:var(--acc);font-weight:750}
#tour .tcap{font-size:15.5px;margin:2px 0 10px}
#tour .tbtn{display:flex;gap:6px;flex-wrap:wrap}
/* ---- flight-display theme: flat panels, hairlines, square corners, colour only for status ---- */
.card,.hero,.btn,.pill,.chip,.navb,.next,pre.rep,.pvt,#tour,#tip,.simnote,.simstrip,.tag,.prog,.prog i,.why .bar,.why .bar i{border-radius:3px}
.card{background:var(--s1);padding:16px}
#rail{background:var(--s1)}#top{background:var(--bg);backdrop-filter:none}
h1{font-size:22px;font-weight:650;letter-spacing:0;margin-bottom:2px}
h2{font:600 11px/1.3 var(--mono);letter-spacing:.06em}
.sub{margin-bottom:14px;font-size:14px}
.brand{font-weight:650}.brand small{letter-spacing:.06em;font-family:var(--mono)}
.navb{font-weight:500;padding:8px 12px}.navb.on{box-shadow:inset 2px 0 0 var(--tx)}.navb.on svg{color:var(--tx)}
.pill.on{border-color:var(--tx)}.pill i{border-radius:2px}
.chip.on{color:var(--tx);border-color:var(--tx);background:var(--s3)}
.btn{font-weight:550}.btn.pri:hover{filter:none;background:#fff}
.simstrip{border-style:solid;border-color:rgba(224,192,74,.4);font-family:var(--mono);letter-spacing:.04em;margin-bottom:12px}
.simnote{border-style:solid;border-color:rgba(224,192,74,.4)}
.hero{background:var(--s1);border:1px solid var(--line);border-left:6px solid var(--lc);padding:18px 20px;gap:18px}
.hero h1{font-size:22px;margin:2px 0 6px}
.hglyph{width:52px;height:52px;border-radius:3px;box-shadow:none}.hglyph.pulse{animation:none}.hglyph svg{width:28px;height:28px}
.eyebrow{font:700 12px var(--mono);letter-spacing:.06em}
.next{background:var(--bg)}.next span{color:var(--mut);font-family:var(--mono);letter-spacing:.06em}
.trail span{font-family:var(--mono);letter-spacing:.04em}.trail .bars i{border-radius:1px}
.flush{padding:0}.flush>h2{padding:12px 16px;margin:0}
.srow{display:grid;grid-template-columns:24px 1.5fr 1.3fr 1fr .9fr 1fr;gap:14px;align-items:center;width:100%;text-align:left;padding:9px 16px;border-top:1px solid var(--line);font-size:14px}
.srow:hover{background:var(--s3)}
.srow .sq{width:22px;height:22px;display:grid;place-items:center;color:#0b0c0e;border-radius:2px}
.srow .r{text-align:right}
ol.steps li:before{border-radius:3px;color:var(--tx)}
tr.hit td{background:var(--s3)}tr.hit td:first-child{box-shadow:inset 3px 0 0 var(--tx)}
.ccard{border-left-width:6px}.ccard h3{font-size:16px}
#tour{border-color:#6b7079;background:#16171b}#tour .tstep{color:var(--mut);font-family:var(--mono);letter-spacing:.06em}
#tip{border-color:#6b7079}
#orb{display:block;width:100%;touch-action:pan-y;cursor:grab}
#view.enter>*{animation:fade .25s ease both;animation-delay:0s!important}
@keyframes fade{from{opacity:0}}
@media (max-width:1000px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
 .app{grid-template-columns:minmax(0,1fr)}#rail{display:none}
 .mbrand{display:flex;align-items:center;gap:8px;font-weight:750}
 #top{padding:8px 14px;gap:8px 10px}
 .pill .fn{display:none}.pill{padding:4px 10px 4px 6px;font-size:13px}
 .crewp{order:3;flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto}.dayctl{order:4;gap:6px}
 .md b{font-size:16px}.md span{display:none}.delay b{font-size:13px}
 #view{padding:16px 14px 110px}
 h1{font-size:20px}.hero h1{font-size:19px}
 .srow{grid-template-columns:24px 1fr auto}.srow .x{display:none}
 .hero{grid-template-columns:auto minmax(0,1fr);padding:18px;gap:14px;align-items:start}.hglyph{width:54px;height:54px}.hglyph svg{width:26px;height:26px}
 .trail{grid-column:1/-1;text-align:left}.trail .bars{justify-content:flex-start}
 .g2,.g4,.g5{grid-template-columns:minmax(0,1fr)}
 .crewg{grid-template-columns:minmax(0,1fr)}
 #tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:#121316;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
 #tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;font-size:11px;color:var(--mut);font-weight:600;border-top:3px solid transparent}
 #tabs button.on{color:var(--tx);border-top-color:var(--tx);background:var(--s3)}
 #tour{bottom:74px}#tour .tcap{font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div class="app">
  <nav id="rail" aria-label="Views"></nav>
  <div>
    <header id="top"></header>
    <main id="view"></main>
  </div>
</div>
<nav id="tabs" aria-label="Views"></nav>
<div id="tour" role="status" aria-live="polite"></div>
<div id="modal"></div>
<div id="tip" role="tooltip"></div>

<!-- ================= CORE: data generation + detection + triage (no DOM) ================= -->
<script id="core">
(function (G) {
  const DAYS = 250, PRE = 30;          // 250-day transit, 30-day pre-flight baseline
  const LAM = 0.25;                    // EWMA smoothing weight
  const H1 = 1.13;                     // EWMA control limit, L=3:  3*sqrt(LAM/(2-LAM))
  const H2 = 1.9;                      // strong deviation, L=5

  function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function gauss(r) { let u = 0; while (!u) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }

  // bad: which direction is adverse. abs: report change in units instead of percent.
  const METRICS = {
    hrv:      { label: 'HRV (RMSSD)',        unit: 'ms',  dom: 'cardio',     bad: 'low',  sd: 5,    dec: 0 },
    rhr:      { label: 'Resting heart rate', unit: 'bpm', dom: 'cardio',     bad: 'high', sd: 2.5,  dec: 0 },
    spo2:     { label: 'SpO₂',               unit: '%',   dom: 'cardio',     bad: 'low',  sd: 0.6,  dec: 1, abs: true },
    sleepH:   { label: 'Sleep duration',     unit: 'h',   dom: 'sleep',      bad: 'low',  sd: 0.5,  dec: 1 },
    sleepEff: { label: 'Sleep efficiency',   unit: '%',   dom: 'sleep',      bad: 'low',  sd: 3,    dec: 0, abs: true },
    rt:       { label: 'Reaction time',      unit: 'ms',  dom: 'vigilance',  bad: 'high', sd: 14,   dec: 0 },
    lapses:   { label: 'Reaction lapses',    unit: '',    dom: 'vigilance',  bad: 'high', sd: 0.9,  dec: 0, abs: true, int: true },
    mood:     { label: 'Mood (self-rated)',  unit: '/10', dom: 'behavioral', bad: 'low',  sd: 0.7,  dec: 0, abs: true, int: true },
    fatigue:  { label: 'Fatigue (self-rated)', unit: '/10', dom: 'behavioral', bad: 'high', sd: 0.8, dec: 0, abs: true, int: true },
    stress:   { label: 'Stress (self-rated)', unit: '/10', dom: 'behavioral', bad: 'high', sd: 0.8, dec: 0, abs: true, int: true },
    activity: { label: 'Exercise',           unit: 'min', dom: 'physical',   bad: 'low',  sd: 14,   dec: 0 },
    temp:     { label: 'Skin temperature',   unit: '°C',  dom: 'physical',   bad: 'both', sd: 0.25, dec: 1, abs: true },
    mass:     { label: 'Body mass',          unit: 'kg',  dom: 'physical',   bad: 'low',  sd: 0.35, dec: 1 }
  };
  const KEYS = Object.keys(METRICS);

  // Fictional crew. Any resemblance to real people is coincidental.
  const CREW = [
    { id: 'chen',  name: 'Mei Chen',       role: 'Flight Engineer', seed: 1101, base: { hrv: 62, rhr: 54, spo2: 97.6, sleepH: 7.1, sleepEff: 90, rt: 262, lapses: 1, mood: 8, fatigue: 3, stress: 3, activity: 120, temp: 33.8, mass: 61.5 } },
    { id: 'okafor', name: 'Daniel Okafor', role: 'Commander',       seed: 2207, base: { hrv: 55, rhr: 58, spo2: 97.2, sleepH: 6.8, sleepEff: 88, rt: 275, lapses: 1, mood: 7, fatigue: 3, stress: 4, activity: 125, temp: 34.0, mass: 82.0 } },
    { id: 'ramirez', name: 'Sofia Ramirez', role: 'Mission Specialist', seed: 3313, base: { hrv: 68, rhr: 52, spo2: 97.8, sleepH: 7.3, sleepEff: 91, rt: 255, lapses: 1, mood: 8, fatigue: 2, stress: 3, activity: 115, temp: 33.6, mass: 58.0 } },
    { id: 'lindqvist', name: 'Erik Lindqvist', role: 'Pilot', seed: 4421, base: { hrv: 58, rhr: 56, spo2: 97.4, sleepH: 7.0, sleepEff: 89, rt: 268, lapses: 1, mood: 7, fatigue: 3, stress: 3, activity: 120, temp: 33.9, mass: 77.0 } }
  ];

  const ramp = (d, a, b) => d <= a ? 0 : d >= b ? 1 : (d - a) / (b - a);
  const idx = d => d < 0 ? d + PRE : d + PRE - 1;      // d = -30..-1 (pre-flight), 1..250 (flight)

  // Injected scenarios: additive change to each metric on flight day d.
  function effects(c, d) {
    const b = c.base;
    if (c.id === 'chen') {            // sleep disruption -> fatigue; she follows the recommendation on day 140
      const e = d <= 140 ? ramp(d, 134, 140) : Math.exp(-(d - 140) / 1.5), s = e * e; // self-ratings lag behind physiology
      return { sleepH: -1.6 * e, sleepEff: -11 * e, hrv: -0.28 * b.hrv * e, rhr: 5 * e, rt: 55 * e, lapses: 4.5 * e, fatigue: 3.2 * s, mood: -1.6 * s, stress: 1.5 * s };
    }
    if (c.id === 'okafor') {          // skipped exercise -> cardiovascular deconditioning
      const off = d > 205 ? Math.exp(-(d - 205) / 8) : 1;
      return { activity: -50 * ramp(d, 150, 162) * off, rhr: 8 * ramp(d, 155, 185) * off, hrv: -0.16 * b.hrv * ramp(d, 155, 185) * off };
    }
    if (c.id === 'ramirez') {         // gradual behavioral health decline
      const e = (d > 225 ? Math.exp(-(d - 225) / 6) : 1) * ramp(d, 185, 205);
      return { mood: -2.6 * e, stress: 2.6 * e, sleepEff: -7 * e };
    }
    return {};
  }

  function generate(c) {
    const r = rng(c.seed), data = {};
    KEYS.forEach(k => data[k] = new Array(PRE + DAYS));
    for (let i = 0; i < PRE + DAYS; i++) {
      const d = i < PRE ? i - PRE : i - PRE + 1, ef = d > 0 ? effects(c, d) : {};
      for (const k of KEYS) {
        const m = METRICS[k];
        let v = c.base[k] + m.sd * gauss(r) + (ef[k] || 0);
        if (k === 'mass' && d > 0) v -= 0.001 * d;
        if (m.int) v = Math.round(v);
        if (k === 'lapses' || k === 'activity') v = Math.max(0, v);
        if (m.unit === '/10') v = Math.min(10, Math.max(1, v));
        if (k === 'spo2') v = Math.min(100, v);
        data[k][i] = v;
      }
    }
    return data;
  }

  // Personal baseline = mean and SD of the 30 pre-flight days.
  function baseline(c) {
    const bl = {};
    for (const k of KEYS) {
      const xs = c.data[k].slice(0, PRE), mean = xs.reduce((a, b) => a + b, 0) / PRE;
      const sd = Math.sqrt(xs.reduce((a, b) => a + (b - mean) ** 2, 0) / (PRE - 1));
      bl[k] = { mean, sd: Math.max(sd, METRICS[k].sd * 0.6) };
    }
    return bl;
  }

  // EWMA of z-scores vs personal baseline; s = deviation in the adverse direction; run = consecutive days beyond limit.
  function analyze(c) {
    c.bl = baseline(c); c.an = {};
    for (const k of KEYS) {
      const m = METRICS[k], b = c.bl[k], s = new Array(DAYS + 1).fill(0), run = new Array(DAYS + 1).fill(0);
      let ew = 0;
      for (let d = 1; d <= DAYS; d++) {
        const z = (c.data[k][idx(d)] - b.mean) / b.sd;
        ew = LAM * z + (1 - LAM) * ew;
        s[d] = m.bad === 'low' ? -ew : m.bad === 'high' ? ew : Math.abs(ew);
        run[d] = s[d] > H1 ? run[d - 1] + 1 : 0;
      }
      c.an[k] = { s, run };
    }
    c.raw = []; c.level = new Array(DAYS + 1).fill(0);
    let streak = 0;
    for (let d = 1; d <= DAYS; d++) {
      const a = assessRaw(c, d); c.raw[d] = a;
      streak = a.level >= 3 ? streak + 1 : 0;
      a.escalated = a.level === 3 && streak > 10 && !(d > 3 && a.score < 0.7 * c.raw[d - 3].score);
      c.level[d] = a.escalated ? 4 : a.level;
    }
  }

  const fmt = (k, v) => v.toFixed(METRICS[k].dec);

  function hardLimits(c, d) {
    const g = k => c.data[k][idx(d)], out = [];
    if (g('spo2') < 92) out.push('SpO₂ is ' + fmt('spo2', g('spo2')) + '% (fixed limit: below 92%).');
    if (g('rhr') > 100) out.push('Resting heart rate is ' + fmt('rhr', g('rhr')) + ' bpm (fixed limit: above 100 bpm).');
    if (g('temp') - c.bl.temp.mean >= 1.5) out.push('Skin temperature is ' + (g('temp') - c.bl.temp.mean).toFixed(1) + ' °C above your baseline (fixed limit: +1.5 °C).');
    return out;
  }

  function assessRaw(c, d) {
    const flags = [];
    for (const k of KEYS) {
      const n = c.an[k].run[d]; if (!n) continue;
      const m = METRICS[k], b = c.bl[k], s = c.an[k].s[d];
      let sum = 0; for (let x = d - n + 1; x <= d; x++) sum += c.data[k][idx(x)];
      const avg = sum / n, diff = avg - b.mean, dir = diff < 0 ? 'below' : 'above';
      const amount = m.abs ? Math.abs(diff).toFixed(1) + (m.unit === '/10' || m.unit === '%' ? ' points' : m.unit === '' ? ' per test' : ' ' + m.unit) : Math.round(Math.abs(diff / b.mean) * 100) + '%';
      const text = m.label + ' has averaged ' + amount + ' ' + dir + ' your personal baseline for ' + n + ' day' + (n > 1 ? 's' : '') +
        ' (' + avg.toFixed(m.dec || 1) + ' vs ' + b.mean.toFixed(m.dec || 1) + (m.unit ? ' ' + m.unit : '') + ').';
      flags.push({ key: k, days: n, s, strong: s > H2, persistent: n >= 3, avg, amount, dir, text, short: m.label + ' ' + (diff < 0 ? '-' : '+') + amount + ' / ' + n + 'd' });
    }
    flags.sort((a, b) => b.s - a.s);
    const pers = flags.filter(f => f.persistent), doms = new Set(pers.map(f => METRICS[f.key].dom)), has = k => pers.some(f => f.key === k);
    const hard = hardLimits(c, d);
    let level = 0, rule = 5;
    if (hard.length) { level = 4; rule = 1; }
    else if ((pers.length >= 3 && doms.size >= 2) || pers.some(f => f.strong && f.days >= 7)) { level = 3; rule = 2; }
    else if (pers.length) { level = 2; rule = 3; }
    else if (flags.length) { level = 1; rule = 4; }
    let pattern = 'generic';
    const any = k => flags.some(f => f.key === k), vig = has('rt') || has('lapses');
    if (((any('sleepH') || any('sleepEff')) && (has('hrv') || vig || has('fatigue'))) || (vig && has('hrv'))) pattern = 'sleep';
    else if (has('activity')) pattern = 'decond';
    else if (has('mood') || has('stress')) pattern = 'behav';
    const score = flags.reduce((a, f) => a + f.s, 0);
    return { level, rule, flags, pers, hard, pattern, score };
  }

  const LEVELS = [
    { name: 'NOMINAL', head: 'All indicators within your personal baseline' },
    { name: 'MONITOR', head: 'Early change — keep an eye on it' },
    { name: 'REPEAT MEASUREMENT', head: 'A sustained change in one area' },
    { name: 'SELF-CARE ACTION', head: 'A multi-signal trend needs action today' },
    { name: 'CONTACT FLIGHT SURGEON', head: 'Send a priority report to your flight surgeon' }
  ];
  const PATTERNS = {
    sleep: { name: 'Sleep disruption / fatigue pattern', steps: [
      'Tonight: protect an 8-hour sleep window. Dim cabin lighting and stop screen use 60 minutes before sleep; get 30 minutes of bright light after waking.',
      'Move your caffeine cut-off to 8 hours before sleep. Where the schedule allows, hand safety-critical tasks to a rested crewmate.',
      'Repeat the reaction-time check-in tomorrow at the same time of day.',
      'An Earth report is ready for flight-surgeon review at the next conference. No real-time reply is needed.' ] },
    decond: { name: 'Cardiovascular deconditioning pattern', steps: [
      'Resume the full prescribed exercise countermeasures (aerobic and resistive) and log every session.',
      'Re-measure resting heart rate on waking for the next 3 days, same time and sensor position.',
      'If you notice chest pain, palpitations, fainting or breathlessness at rest, treat it as urgent: follow the onboard medical checklist and contact the flight surgeon.',
      'An Earth report is ready for flight-surgeon review.' ] },
    behav: { name: 'Behavioral health pattern', steps: [
      'Request a private conference with the behavioral health team (asynchronous message).',
      'Protect personal time and family contact this week. Reviewing workload with the commander is your choice.',
      'Keep doing the daily check-in. Your self-ratings stay private unless you choose to send them.',
      'An Earth report is ready if you choose to send it.' ] },
    generic: { name: 'Multi-signal change', steps: [
      'Repeat the flagged measurements tomorrow under the same conditions (sensor fit, time of day).',
      'Review sleep, workload and exercise for the past week for an obvious cause.',
      'An Earth report is ready for flight-surgeon review.' ] }
  };
  const RULES = [
    { n: 1, when: 'Any fixed safety limit crossed (SpO₂ < 92%, resting HR > 100 bpm, skin temp ≥ +1.5 °C over baseline)', then: 'CONTACT FLIGHT SURGEON — priority report, onboard medical checklist, re-measure immediately' },
    { n: 2, when: '3 or more indicators beyond personal limits for 3+ days across 2+ body systems, OR one strong deviation for 7+ days', then: 'SELF-CARE ACTION matched to the pattern + repeat test + Earth report (escalates to flight surgeon if unchanged after 10 days)' },
    { n: 3, when: '1–2 indicators beyond personal limits for 3+ days', then: 'REPEAT MEASUREMENT under the same conditions; no other action yet' },
    { n: 4, when: 'Any indicator beyond its limit for 1–2 days', then: 'MONITOR — too early to call a trend' },
    { n: 5, when: 'None of the above', then: 'NOMINAL' }
  ];

  function assess(c, d) {
    const a = Object.assign({}, c.raw[d]); a.level = c.level[d];
    const L = LEVELS[a.level], P = PATTERNS[a.pattern];
    a.name = L.name; a.head = L.head; a.patternName = a.level >= 3 && !a.hard.length ? P.name : '';
    a.recovering = a.level >= 1 && d > 3 && c.raw[d - 3].level >= 2 && a.score < 0.7 * c.raw[d - 3].score;
    if (a.hard.length) a.steps = ['Send a priority Earth report to the flight surgeon now.', 'Follow the onboard medical checklist for this symptom.', 'Repeat the measurement immediately to rule out a sensor error.'];
    else if (a.escalated) a.steps = ['This pattern has lasted more than 10 days despite self-care. Send a priority Earth report and request a flight-surgeon consult.'].concat(P.steps.slice(0, 2));
    else if (a.level === 3) a.steps = P.steps;
    else if (a.level === 2) a.steps = ['Repeat this measurement tomorrow under the same conditions (sensor fit, time of day) to rule out a sensor problem or a one-off cause.', 'No other action is needed yet. Health Copilot keeps watching the trend.'];
    else if (a.level === 1) a.steps = ['Nothing to do. This is an early change that ordinary day-to-day variation can produce.'];
    else a.steps = ['Nothing to do. Complete today’s check-in to keep your baseline current.'];
    a.why = a.hard.concat(a.flags.map(f => f.text + (f.persistent ? '' : ' Too early to call a trend.')));
    return a;
  }

  // Simulated trajectory: Earth–spacecraft distance grows to 1.5 AU at arrival. 1 AU = 499 light-seconds.
  const lightSec = d => Math.round(499 * 1.5 * Math.pow(d / DAYS, 1.3));
  // Radiation (simulated): 1.84 mSv/day galactic cosmic ray dose equivalent in cruise (MSL/RAD, Zeitlin et al. 2013) + one solar particle event on day 172.
  const SPE_DAY = 172, SPE_DOSE = 30, DOSE_LIMIT = 600;
  const dose = d => 1.84 * d + (d >= SPE_DAY ? SPE_DOSE : 0);

  function build(overrides) {
    const crew = CREW.map(c => Object.assign({}, c));
    crew.forEach(c => {
      c.data = generate(c);
      const o = (overrides || {})[c.id] || {};
      for (const d in o) for (const k in o[d]) if (c.data[k]) c.data[k][idx(+d)] = o[d][k];
      analyze(c);
    });
    return crew;
  }

  G.HC = { DAYS, PRE, LAM, H1, H2, METRICS, KEYS, LEVELS, RULES, PATTERNS, idx, build, assess, analyze, lightSec, dose, SPE_DAY, DOSE_LIMIT, fmt };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>

  const store = { get(k, f) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch (e) { return f; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
  const ico = (p, sz) => `<svg viewBox="0 0 24 24" width="${sz || 20}" height="${sz || 20}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;

  const NI = {

    trends: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',

  };

    ['cardio', 'Heart & circulation', ['hrv', 'rhr', 'spo2']],

  ];

  let overrides = store.get('hc_checkins', {});
  let crew = H.build(overrides);
  const S = { day: 140, who: 'chen', view: 'today', hwin: 60, hmode: 'map', yaw: 2.5, pitch: 0.95, pk: null, metric: 'hrv', sent: {}, donki: store.get('hc_donki', null), dkErr: '' };
  const T = { on: false, paused: false, skip: false, stop: false, jump: -1, i: 0, n: 7, text: '' };
  const cur = () => crew.find(c => c.id === S.who);
  const mmss = s => Math.floor(s / 60) + ' min ' + String(s % 60).padStart(2, '0') + ' s';
  const val = (c, k, d) => c.data[k][H.idx(d)];
  const fx = (k, v) => v.toFixed(H.METRICS[k].dec), un = k => { const u = H.METRICS[k].unit; return !u ? '' : u === '%' || u === '/10' ? u : ' ' + u; };
  // ---------- orbital model: Hohmann transfer, circular coplanar orbits (simplified) ----------
  const KG = 0.01720209895, AT = 1.262, ET = 0.2076, NT = KG / Math.pow(AT, 1.5), TOF = Math.PI / NT, NM = KG / Math.pow(1.524, 1.5);
  function craft(d) { const M = NT * d; let E = M; for (let i = 0; i < 8; i++) E -= (E - ET * Math.sin(E) - M) / (1 - ET * Math.cos(E));
    const r = AT * (1 - ET * Math.cos(E)), v = 2 * Math.atan2(Math.sqrt(1 + ET) * Math.sin(E / 2), Math.sqrt(1 - ET) * Math.cos(E / 2)); return [r * Math.cos(v), r * Math.sin(v)]; }
  const earth = d => [Math.cos(KG * d), Math.sin(KG * d)];
  const mars = d => { const a = Math.PI - NM * (TOF - d); return [1.524 * Math.cos(a), 1.524 * Math.sin(a)]; };
  const distAU = d => { const c = craft(d), e = earth(d); return Math.hypot(c[0] - e[0], c[1] - e[1]); };
  const LS = d => Math.round(499.005 * distAU(d));   // one-way light time in seconds
  const logo = '<svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="5" fill="var(--acc)"/><ellipse cx="15" cy="15" rx="13" ry="6" fill="none" stroke="var(--acc)" stroke-width="1.5" transform="rotate(-28 15 15)"/><circle cx="25.5" cy="8.6" r="1.8" fill="var(--tx)"/></svg>';

  // ---------- chrome ----------
  function renderRail() {

      <div class="simnote"><b>SIMULATED DATA.</b> The crew and every health value are generated, not real. Prototype decision support, not a medical device.</div>`;
    $('tabs').innerHTML = NAV.slice(0, 5).map(n => `<button class="${S.view === n[0] ? 'on' : ''}" ${S.view === n[0] ? 'aria-current="page"' : ''} onclick="UI.go('${n[0]}')">${ico(NI[n[0]], 22)}${n[1]}</button>`).join('');
  }

  function renderTop() {

      <div class="dayctl">
        <div class="md"><b class="mono" id="mdl">MD ${S.day}</b><span>mission day of ${H.DAYS}</span></div>

  function trail(c, d) {

    return `<div class="trail" role="img" aria-label="Triage level for the last ${d - d0 + 1} days; today ${H.LEVELS[c.level[d]].name}"><div class="bars">${h}</div><span>Last 14 days</span></div>`;
  }
  function hero(c, a, full) {
    const title = a.recovering ? (a.level < 3 ? 'Your indicators are moving back toward baseline' : 'The trend is recovering. Keep the plan going.') : a.head;
    return `<section class="hero" style="--lc:${LV[a.level]}">
      <div class="hglyph ${a.level >= 3 ? 'pulse' : ''}">${ico(LI[a.level], 36)}</div>

        ${full ? `<div class="next"><span>Next step</span>${a.steps[0]}</div>
        <div class="hact"><button class="btn ${a.level >= 2 ? 'pri' : ''}" onclick="UI.go('alert')">Why, and what do I do?</button><button class="btn" onclick="UI.go('trends')">See the drift map</button></div>` : ''}</div>
      ${trail(c, S.day)}</section>`;
  }
  function chart(c, k, d, range, W, Ht) {
    const m = H.METRICS[k], b = c.bl[k], d0 = Math.max(1, d - range + 1), L = 44, R = 10, Tp = 10, B = 20;
    let lo = b.mean - 2.6 * b.sd, hi = b.mean + 2.6 * b.sd;
    for (let x = d0; x <= d; x++) { const v = val(c, k, x); lo = Math.min(lo, v); hi = Math.max(hi, v); }
    const pad = (hi - lo) * 0.06; lo -= pad; hi += pad;
    const X = x => L + (x - d0) / Math.max(1, d - d0) * (W - L - R), Y = v => Tp + (1 - (v - lo) / (hi - lo)) * (Ht - Tp - B);
    let path = '', pts = '';
    for (let x = d0; x <= d; x++) {
      const v = val(c, k, x); path += (x === d0 ? 'M' : 'L') + X(x).toFixed(1) + ' ' + Y(v).toFixed(1);
      const n = c.an[k].run[x]; if (n) pts += n >= 3 ? `<rect x="${(X(x) - 3).toFixed(1)}" y="${(Y(v) - 3).toFixed(1)}" width="6" height="6" transform="rotate(45 ${X(x).toFixed(1)} ${Y(v).toFixed(1)})" fill="#ee8a3c"/>` : `<circle cx="${X(x).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.4" fill="#5b9fe0"/>`;
    }
    const y1 = Y(b.mean + 2 * b.sd), y2 = Y(b.mean - 2 * b.sd), f = v => v.toFixed(m.dec || 1);
    return `<svg viewBox="0 0 ${W} ${Ht}" width="100%" role="img" aria-label="${m.label}, last ${d - d0 + 1} days, against the personal baseline band">
      <rect x="${L}" y="${y1}" width="${W - L - R}" height="${y2 - y1}" fill="#e8e9eb" opacity=".10" rx="3"/>

        <p class="note" style="margin:8px 0 0">Computed model: a Hohmann transfer between circular, coplanar Earth and Mars orbits (about 259 days), drawn to scale. Real trajectories and planetary orbits differ. Signal delay is the Earth-to-spacecraft distance divided by the speed of light.</p></div>
      <div class="grid g2 mt"><div class="card"><h2>Report for mission control</h2><pre class="rep mono">${txt}</pre>
        ${st ? `<div class="prog"><i id="pbar" style="width:${st === 'done' ? 100 : 0}%"></i></div><div id="pmsg">${st === 'done' ? `Delivered after ${mmss(ls)}. Earliest possible reply in another ${mmss(ls)}.` : 'Transmitting…'}</div>` : `<div class="hact"><button class="btn pri" onclick="UI.send()">Send to Earth</button></div><p class="note" style="margin:8px 0 0">Self-ratings leave this device only when you send the report.</p>`}</div>
        <div class="card"><h2>While you wait</h2><ol class="steps">${a.steps.map(s => `<li>${s}</li>`).join('')}</ol></div></div>`;
  };

  function rad(d) {
    const W = 520, Ht = 190, L = 40, R = 12, Tp = 14, B = 22, X = x => L + x / H.DAYS * (W - L - R), Y = v => Tp + (1 - v / 660) * (Ht - Tp - B);
    let p = 'M' + X(0) + ' ' + Y(0); for (let x = 1; x <= d; x++) p += 'L' + X(x).toFixed(1) + ' ' + Y(H.dose(x)).toFixed(1);
    const now = H.dose(d), end = now + 1.84 * (H.DAYS - d);
    return `<svg viewBox="0 0 ${W} ${Ht}" width="100%" role="img" aria-label="Cumulative simulated radiation dose ${now.toFixed(0)} millisievert of a 600 millisievert career limit">
      <line x1="${L}" x2="${W - R}" y1="${Y(600)}" y2="${Y(600)}" stroke="#e5484d" stroke-dasharray="5 5"/><text x="${W - R}" y="${Y(600) - 5}" text-anchor="end" style="fill:#e5484d">600 mSv career limit</text>
      <path d="${p}L${X(d).toFixed(1)} ${Y(0)}Z" fill="#e8e9eb" opacity=".14"/><path d="${p}" fill="none" stroke="#e8e9eb" stroke-width="2"/>
      <line x1="${X(d)}" y1="${Y(now)}" x2="${X(H.DAYS)}" y2="${Y(end)}" stroke="#9a9fa8" stroke-dasharray="2 5"/>
      ${d >= H.SPE_DAY ? `<line x1="${X(H.SPE_DAY)}" x2="${X(H.SPE_DAY)}" y1="${Y(H.dose(H.SPE_DAY)) - 26}" y2="${Y(H.dose(H.SPE_DAY))}" stroke="#e0c04a"/><text x="${X(H.SPE_DAY) - 4}" y="${Y(H.dose(H.SPE_DAY)) - 30}" text-anchor="end" style="fill:#e0c04a">solar particle event (simulated)</text>` : ''}
      <circle cx="${X(d)}" cy="${Y(now)}" r="4" fill="#fff"/>
      <text x="${L - 6}" y="${Y(0) + 3}" text-anchor="end">0</text><text x="${L - 6}" y="${Y(300) + 3}" text-anchor="end">300</text><text x="${L}" y="${Ht - 5}">MD 1</text><text x="${W - R}" y="${Ht - 5}" text-anchor="end">MD ${H.DAYS}</text></svg>`;
  }
  V.crew = () => {
    const dose = H.dose(S.day), avg = k => (crew.reduce((s, c) => s + val(c, k, S.day), 0) / crew.length).toFixed(1), dk = S.donki;
    const cards = crew.map(c => { const a = H.assess(c, S.day), n = a.flags.filter(f => f.persistent).length;
      return `<div class="card ccard" style="--lc:${LV[a.level]}"><div class="eyebrow" style="display:flex;gap:6px;align-items:center">${ico(LI[a.level], 15)}${a.name}</div><h3>${c.name}</h3><div class="note">${c.role}${a.recovering ? ' · recovering' : ''}</div>
        <p style="margin:8px 0 10px">${a.level >= 2 ? n + ' indicator' + (n === 1 ? '' : 's') + ' outside personal limits' : 'No sustained changes'}</p>
        <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:8px"><button class="btn sm" onclick="UI.who('${c.id}','today')">Open</button>${trail(c, S.day)}</div></div>`; }).join('');
    return `${strip}<h1>Crew and environment</h1><p class="sub">The shared view shows triage level only. Individual numbers and self-ratings stay on each person’s own screen.</p>
      <div class="grid g4 crewg">${cards}</div>
      <div class="grid g2 mt">
        <div class="card"><h2>Cumulative radiation dose · simulated</h2><div class="kv"><div><span>So far</span><b>${dose.toFixed(0)}<small>mSv</small></b></div><div><span>Share of career limit</span><b>${(dose / H.DOSE_LIMIT * 100).toFixed(0)}<small>%</small></b></div></div>
          ${rad(S.day)}<p class="note" style="margin:6px 0 0">Model: 1.84 mSv/day in cruise, the rate NASA’s RAD instrument measured on the way to Mars (Zeitlin et al., 2013). Limit from NASA-STD-3001. The size of the solar particle event is an invented value.</p></div>
        <div><div class="card"><h2>Space weather relay <span class="tag" style="color:var(--l0)">REAL NASA DATA</span></h2>
          ${dk ? `<div class="kv"><div><span>Solar flares, 30 days</span><b>${dk.flares}</b></div><div><span>Strongest flare</span><b>${dk.maxClass || '—'}</b></div><div><span>Particle events</span><b>${dk.sep}</b></div></div>
          <p style="margin:10px 0 0">${dk.sep ? 'A solar energetic particle event was reported in the last 30 days (most recent: ' + dk.lastSep + '). Rule: review the storm-shelter procedure and log time spent in the shelter.' : 'No solar energetic particle events reported in the last 30 days. No action.'}</p>
          <p class="note">From NASA DONKI via api.nasa.gov, fetched ${new Date(dk.at).toLocaleString()} and stored on this device so it stays readable offline. These are today’s real Sun conditions, shown beside a simulated mission.</p>` : `<p class="note" id="dkmsg">${S.dkErr || 'No space weather data stored yet.'}</p>`}
          <button class="btn sm" onclick="UI.donki()">Refresh from NASA</button></div>
        <div class="card mt"><h2>Crew average today · anonymized</h2><div class="kv"><div><span>Mood</span><b>${avg('mood')}<small>/10</small></b></div><div><span>Stress</span><b>${avg('stress')}<small>/10</small></b></div><div><span>Sleep</span><b>${avg('sleepH')}<small>h</small></b></div></div></div></div>
      </div>`;
  };
  V.method = () => `${strip}<h1>How it works</h1><p class="sub">Everything here is simple enough to check by hand. There is no black-box model.</p>
    <div class="grid g2">
      <div class="card"><h2>1 · Personal baseline</h2><p>For each crew member and each of ${H.KEYS.length} indicators, the mean and standard deviation of 30 pre-flight days define that person’s normal. Nobody is compared with a population average.</p>
        <h2>2 · Drift detection</h2><p>Each day’s value becomes a z-score against the personal baseline. An exponentially weighted moving average (EWMA, weight ${H.LAM}) accumulates small shifts that a fixed threshold would miss. An indicator is beyond its limit when the EWMA passes ${H.H1} in the harmful direction, the standard 3-sigma EWMA control limit (Roberts, 1959).</p>
        <h2>3 · Triage</h2><p>A five-row decision table turns the number of flagged indicators, how long they have lasted and which body systems they belong to into one of five levels. Three fixed safety limits bypass the baseline entirely.</p>
        <h2>4 · Signal delay</h2><p style="margin-bottom:0">The Earth view computes a Hohmann transfer between circular, coplanar Earth and Mars orbits and divides the Earth-to-spacecraft distance by the speed of light. It is a simplified model, not a real mission trajectory.</p></div>
      <div class="card"><h2>Decision table</h2><div style="overflow-x:auto"><table><tr><th>#</th><th>When</th><th>Then</th></tr>${H.RULES.map(r => `<tr><td class="mono">${r.n}</td><td>${r.when}</td><td>${r.then}</td></tr>`).join('')}</table></div></div>
      <div class="card"><h2>What is real and what is simulated</h2>
        <p><b>Simulated:</b> the 4-person crew, their 30 pre-flight days and the 250-day transit are generated in the browser from a fixed seed. Crew names are fictional. Baseline values and the size of each injected scenario (sleep disruption, cardiovascular deconditioning, behavioral health decline) are illustrative: chosen to be physiologically plausible, not taken from spaceflight datasets. The 30 mSv solar particle event is an invented value.</p>
        <p><b>Real NASA data:</b> the space weather panel reads solar flare and solar energetic particle events from NASA’s DONKI database.</p>
        <p style="margin-bottom:0"><b>From published sources:</b> only three numbers. Cruise radiation of 1.84 mSv/day (Zeitlin et al., 2013, Mars Science Laboratory RAD); the 600 mSv career limit (NASA-STD-3001); and a reaction-time lapse defined as a response of 500 ms or slower (Basner &amp; Dinges, 2011).</p></div>
      <div class="card"><h2>Limits of this prototype</h2><ul class="clean"><li>Not a diagnostic device. Thresholds and guidance have not been clinically validated.</li><li>The simulation is simpler than real physiology: no sensor dropouts, no day-to-day correlation, and no normal adaptation to microgravity.</li><li>Recovery in the tour is scripted. It assumes the crew member follows the recommendation.</li><li>The baseline is fixed at pre-flight values. A flight version would re-baseline in flight and use protocols approved by flight surgeons.</li><li>The reaction test is a 30-second version of a psychomotor vigilance test and depends on the device’s input lag.</li></ul></div>
    </div>`;

  function renderView(anim) {
    const v = $('view'); hideTip();
    v.innerHTML = V[S.view](cur());
    if (anim) { v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); }
    drawHeat(); drawOrbit();
  }
  function render(anim) { renderRail(); renderTop(); renderView(anim); }
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { drawHeat(); drawOrbit(); }, 120); });

  // ---------- check-in (reaction test + self-ratings) ----------
  let pv = null;
  function checkin() {
    $('modal').innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="Daily check-in"><div class="card"><h2>Daily check-in · 1 of 2</h2><h3>Reaction test</h3>
      <p class="note" style="margin:0">Tap the box (or press space) the moment the counter appears. 30-second version of a psychomotor vigilance test.</p>
      <button class="pvt mono" id="pvt" style="width:100%" onclick="UI.pvtTap()">Tap to begin</button>
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="note">A lapse is a response of 500 ms or slower.</span><button class="btn sm" onclick="UI.close()">Cancel</button></div></div></div>`;
    pv = { state: 'idle', rts: [], fs: 0 }; $('pvt').focus();
  }
  function pvtNext() { pv.state = 'wait'; $('pvt').textContent = '·'; $('pvt').style.color = 'var(--mut)'; pv.timer = setTimeout(() => { pv.state = 'go'; pv.shown = performance.now(); $('pvt').style.color = 'var(--l2)'; tick(); }, 1500 + Math.random() * 2500); }
  function tick() { if (!pv || pv.state !== 'go' || !$('pvt')) return; $('pvt').textContent = Math.round(performance.now() - pv.shown); requestAnimationFrame(tick); }
  function pvtTap() {
    if (!pv) return;
    if (pv.state === 'idle') { pv.end = setTimeout(pvtDone, 30000); pvtNext(); }
    else if (pv.state === 'wait') { pv.fs++; clearTimeout(pv.timer); $('pvt').textContent = 'Too early'; pv.state = 'pause'; setTimeout(() => pv && pv.state === 'pause' && pvtNext(), 700); }
    else if (pv.state === 'go') { const rt = performance.now() - pv.shown; pv.rts.push(rt); pv.state = 'pause'; $('pvt').textContent = Math.round(rt) + ' ms'; $('pvt').style.color = 'var(--tx)'; setTimeout(() => pv && pv.state === 'pause' && pvtNext(), 600); }
  }
  function pvtDone() {
    clearTimeout(pv.timer); if (pv.state === 'go') pv.rts.push(performance.now() - pv.shown);
    pv.state = 'done';
    const n = pv.rts.length, mean = n ? pv.rts.reduce((a, b) => a + b, 0) / n : 500, lapses = pv.rts.filter(r => r >= 500).length;
    pv.res = { rt: Math.round(mean), lapses };
    const sl = (k, l, v) => `<div class="sl"><label for="s_${k}">${l}</label><input id="s_${k}" type="range" min="1" max="10" value="${v}" oninput="this.nextElementSibling.textContent=this.value"><b class="mono">${v}</b></div>`;
    $('modal').innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="Daily check-in"><div class="card"><h2>Daily check-in · 2 of 2</h2><h3>How are you today?</h3>
      <div class="kv" style="margin:10px 0 14px"><div><span>Mean reaction time</span><b>${pv.res.rt}<small>ms</small></b></div><div><span>Responses</span><b>${n}</b></div><div><span>Lapses</span><b>${lapses}</b></div><div><span>Early taps</span><b>${pv.fs}</b></div></div>
      ${sl('mood', 'Mood', 7)}${sl('fatigue', 'Fatigue', 3)}${sl('stress', 'Stress', 3)}
      <p class="note">1 = lowest, 10 = highest. Saved on this device only.</p>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="UI.close()">Discard</button><button class="btn pri" onclick="UI.save()">Save check-in</button></div></div></div>`;
  }
  function save() {
    const o = overrides[S.who] = overrides[S.who] || {};
    o[S.day] = { rt: pv.res.rt, lapses: pv.res.lapses, mood: +$('s_mood').value, fatigue: +$('s_fatigue').value, stress: +$('s_stress').value };
    store.set('hc_checkins', overrides); crew = H.build(overrides); close(); render();
  }
  function close() { if (pv) { clearTimeout(pv.timer); clearTimeout(pv.end); } pv = null; $('modal').innerHTML = ''; }
  document.addEventListener('keydown', e => { if (pv && e.code === 'Space') { e.preventDefault(); pvtTap(); } else if (pv && e.code === 'Escape') close(); });

  // ---------- Earth report send (time-compressed) ----------
  function send(ms) {
    const key = S.who + S.day, ls = LS(S.day); S.sent[key] = 'going'; renderView();
    const t0 = performance.now(), dur = ms || 5000;
    (function step() {
      const p = Math.min(1, (performance.now() - t0) / dur), bar = $('pbar'), msg = $('pmsg');
      if (!bar || S.sent[key] !== 'going') return;
      bar.style.width = p * 100 + '%'; msg.textContent = 'Signal in transit: ' + mmss(Math.round(p * ls)) + ' of ' + mmss(ls) + ' (time compressed)';
      S.pk = p; drawOrbit();
      if (p < 1) requestAnimationFrame(step); else { S.pk = null; S.sent[key] = 'done'; renderView(); }
    })();
  }

  // ---------- NASA DONKI (real data) ----------
  async function donki() {
    const msg = $('dkmsg'); if (msg) msg.textContent = 'Contacting api.nasa.gov…';
    const iso = t => new Date(t).toISOString().slice(0, 10), end = Date.now(), q = `startDate=${iso(end - 30 * 864e5)}&endDate=${iso(end)}&api_key=${NASA_KEY}`;
    try {
      const [f, s] = await Promise.all(['FLR', 'SEP'].map(p => fetch(`https://api.nasa.gov/DONKI/${p}?${q}`).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }).then(t => t ? JSON.parse(t) : [])));
      const rank = c => ({ A: 0, B: 1, C: 2, M: 3, X: 4 }[c[0]] || 0) * 100 + parseFloat(c.slice(1) || 0);
      const classes = f.map(x => x.classType).filter(Boolean).sort((a, b) => rank(b) - rank(a));
      S.dkErr = ''; S.donki = { at: Date.now(), flares: f.length, maxClass: classes[0] || '', sep: s.length, lastSep: s.length ? String(s[s.length - 1].eventTime || '').slice(0, 10) : '' };
      store.set('hc_donki', S.donki); if (S.view === 'crew') renderView();
    } catch (e) { S.dkErr = 'Could not reach NASA DONKI (offline or rate limit). ' + (S.donki ? '' : 'Nothing stored yet; try again when online.'); const m = $('dkmsg'); if (m) m.textContent = S.dkErr; }
  }

  // ---------- guided tour ----------
  const nap = ms => new Promise(r => setTimeout(r, ms));
  function tourBar() {
    const el = $('tour'); if (!T.on) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    el.innerHTML = `<div class="tprog"><i style="width:${((T.i + 1) / T.n * 100).toFixed(0)}%"></i></div><div class="tin"><div class="tstep">TOUR ${T.i + 1} / ${T.n}${T.paused ? ' · PAUSED' : ''}</div><div class="tcap">${T.text}</div>
      <div class="tbtn"><button class="btn sm" onclick="UI.tpause()">${T.paused ? '▶ Resume' : '❚❚ Pause'}</button><button class="btn sm" onclick="UI.tnext()">Next ▸</button>${T.i < 2 ? '<button class="btn sm" onclick="UI.tjump()">Skip to day 140</button>' : ''}<button class="btn sm" onclick="UI.tour()">End tour</button></div></div>`;
  }
  async function hold(ms) { let t = 0; while (t < ms) { if (T.stop) throw 0; if (T.skip) return; await nap(80); if (!T.paused) t += 80; } }
  const say = t => { T.text = t; tourBar(); };
  const STEPS = [
    async () => { S.who = 'chen'; S.view = 'today'; S.day = 132; S.sent = {}; render(true); say('Mission day 132, en route to Mars. Flight Engineer Chen feels fine, and every indicator sits inside her personal baseline.'); await hold(5000); },
    async () => { S.view = 'trends'; S.hwin = 30; S.hmode = 'map'; S.metric = 'hrv'; render(true); say('Her sleep shortens, HRV drifts down and reaction lapses rise. No single day looks alarming, but the drift map starts to warm. Copilot begins watching on day 137.');
      for (let d = 133; d <= 139; d++) { S.day = d; render(); await hold(1100); } await hold(1200); },
    async () => { S.day = 140; S.view = 'today'; render(true); say('Day 140. Copilot escalates to Self-care action: several signals have drifted together. Her own fatigue rating only left its normal range today, three days after the first flag.'); await hold(7000); },
    async () => { S.view = 'alert'; render(true); say('It says why in plain language and gives a clear next step: change the sleep and light schedule, then repeat the test tomorrow. The rule that fired is on screen.'); await hold(8000); },
    async () => { S.view = 'report'; render(true); send(4500); say('A report under 1 kB leaves for Earth. On day 140 a reply is at least ' + Math.floor(2 * LS(140) / 60) + ' minutes away and the gap keeps growing, so she already has what she needs to act.'); await hold(7500); },
    async () => { S.view = 'today'; for (let d = 141; d <= 143; d++) { S.day = d; render(d === 141); say('She follows the plan. Day ' + d + ': the trend is recovering toward her baseline.'); await hold(1900); } },
    async () => { S.view = 'trends'; S.hwin = 30; S.metric = 'hrv'; render(true); const dt = $('detail'); if (dt) dt.scrollIntoView({ block: 'center' }); say('Three days later her daily values are back inside her own band, and the map cools as the smoothed trend catches up. In this simulation she follows the advice. The tool explains and suggests; it never diagnoses.'); await hold(9000); window.scrollTo(0, 0); }
  ];
  async function tour() {
    if (T.on) { T.stop = true; T.on = false; tourBar(); renderTop(); return; }
    Object.assign(T, { on: true, paused: false, skip: false, stop: false, jump: -1, i: 0 });
    try { while (T.i < STEPS.length) { T.skip = false; await STEPS[T.i](); if (T.stop) throw 0; if (T.jump >= 0) { T.i = T.jump; T.jump = -1; } else T.i++; } } catch (e) {}
    T.on = false; T.stop = false; tourBar(); renderTop();
  }

  window.UI = {
    go(v) { S.view = v; render(true); window.scrollTo(0, 0); },
    who(id, v) { S.who = id; if (v) S.view = v; render(true); },
    day(d) { S.day = Math.min(H.DAYS, Math.max(1, d)); render(); },
    slide(d) { S.day = d; $('mdl').textContent = 'MD ' + d; $('lsl').textContent = mmss(LS(d)); $('crewp').innerHTML = pills(); renderView(); },
    story() { S.who = 'chen'; S.day = 140; S.view = 'today'; render(true); window.scrollTo(0, 0); },
    hwin(r) { S.hwin = r; renderView(); }, hmode(m) { S.hmode = m; renderView(); },
    metric(k) { S.metric = k; S.view = 'trends'; render(true); window.scrollTo(0, 0); },
    tpause() { T.paused = !T.paused; tourBar(); }, tnext() { T.paused = false; T.skip = true; }, tjump() { T.paused = false; T.jump = 2; T.skip = true; },
    checkin, pvtTap, save, close, send, donki, tour
  };
  render(true);
  if (!S.donki || Date.now() - S.donki.at > 6 * 36e5) donki();
})();
</script>
</body>
</html>
